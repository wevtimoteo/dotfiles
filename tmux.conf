# Tmux configs

# Ensure DOTFILES_DIR is available to shell commands in status bar
run 'tmux set-environment -g DOTFILES_DIR "$HOME/Sites/dotfiles"'

# Reload the file with Prefix r.
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Set C-a as default shortcut instead C-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set VI key bindings
set -g status-keys vi
setw -g mode-keys vi

# Splitting panes
bind | split-window -h
bind - split-window -v

# Moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Synchronize panes
bind C-s setw synchronize-panes

# Resizing panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# History Limit
set -g history-limit 15000

# Setup 'v' to begin selection and 'y' to copy in vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Dracula purple highlight for visual selection in copy mode
set-window-option -g mode-style 'fg=#282a36,bg=#bd93f9'

# Disable activity alerts
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# 256 colors
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

set-option -g repeat-time 0

# Removes ESC delay
set -sg escape-time 0

# Image preview in Tmux (via yazi)
# https://github.com/sxyazi/yazi/wiki/Image-preview-within-tmux
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin configuration (must be set before sourcing the plugin)
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #{?#{m:*.*.*,#{pane_current_command}},claude,#{pane_current_command}}'
set -g @catppuccin_window_current_text ' #{?#{m:*.*.*,#{pane_current_command}},claude,#{pane_current_command}}'
set -g @catppuccin_window_number_position 'left'
# Load catppuccin synchronously so custom modules can use its utilities
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Custom catppuccin status modules (manually assembled with rounded separators)
# nowplaying
set -gF  @catppuccin_status_nowplaying "#[fg=#{@thm_teal}]#{@catppuccin_status_left_separator}"
set -agF @catppuccin_status_nowplaying "#[fg=#{@thm_crust},bg=#{@thm_teal}]󰎈 #{@catppuccin_status_middle_separator}"
set -agF @catppuccin_status_nowplaying "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
set -ag  @catppuccin_status_nowplaying " #($DOTFILES_DIR/scripts/tmux-nowplaying.sh)"
set -agF @catppuccin_status_nowplaying "#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# ping
set -gF  @catppuccin_status_ping "#[fg=#{@thm_yellow}]#{@catppuccin_status_left_separator}"
set -agF @catppuccin_status_ping "#[fg=#{@thm_crust},bg=#{@thm_yellow}]󰛳 #{@catppuccin_status_middle_separator}"
set -agF @catppuccin_status_ping "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
set -ag  @catppuccin_status_ping " #($DOTFILES_DIR/scripts/tmux-ping.sh)"
set -agF @catppuccin_status_ping "#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# loadavg
set -gF  @catppuccin_status_loadavg "#[fg=#{@thm_peach}]#{@catppuccin_status_left_separator}"
set -agF @catppuccin_status_loadavg "#[fg=#{@thm_crust},bg=#{@thm_peach}]󰊚 #{@catppuccin_status_middle_separator}"
set -agF @catppuccin_status_loadavg "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
set -ag  @catppuccin_status_loadavg " #($DOTFILES_DIR/scripts/tmux-loadavg.sh)"
set -agF @catppuccin_status_loadavg "#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# clock
set -gF  @catppuccin_status_clock "#[fg=#{@thm_sapphire}]#{@catppuccin_status_left_separator}"
set -agF @catppuccin_status_clock "#[fg=#{@thm_crust},bg=#{@thm_sapphire}]󰥔 #{@catppuccin_status_middle_separator}"
set -agF @catppuccin_status_clock "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
set -ag  @catppuccin_status_clock " %H:%M"
set -agF @catppuccin_status_clock "#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# Status line
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 250
set -gF  status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_nowplaying}"
set -agF status-right "#{@catppuccin_status_ping}"
set -agF status-right "#{@catppuccin_status_loadavg}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{@catppuccin_status_clock}"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Active pane visibility (must be after TPM to avoid catppuccin overriding these)
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#babbf1,bg=#303446,bold'
set -g pane-border-style 'fg=#626880,bg=#2e3142'
set -g pane-border-format ' #{?pane_active,#[fg=#232634]#[bg=#bd93f9]#[bold] ACTIVE #[default],#[fg=#737994] pane} #[fg=#{?pane_active,#c6d0f5,#a5adce}]#P #{pane_current_command} '
set -g window-style 'bg=#2e3142'
set -g window-active-style 'bg=#303446'
