# Tmux configs

# Ensure DOTFILES_DIR is available to shell commands in status bar
run 'tmux set-environment -g DOTFILES_DIR "$HOME/Sites/dotfiles"'

# Reload the file with Prefix r.
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Set C-a as default shortcut instead C-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set VI key bindings
set -g status-keys vi
setw -g mode-keys vi

# Splitting panes
bind | split-window -h
bind - split-window -v

# Moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Synchronize panes
bind C-s setw synchronize-panes

# Resizing panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# History Limit
set -g history-limit 15000

# Setup 'v' to begin selection and 'y' to copy in vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Dracula purple highlight for visual selection in copy mode
set-window-option -g mode-style 'fg=#282a36,bg=#bd93f9'

# Disable activity alerts
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# 256 colors
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Active pane: catppuccin lavender border + dim inactive panes
set -g pane-active-border-style 'fg=#babbf1'
set -g pane-border-style 'fg=#51576d'
set -g window-style 'bg=#292c3c'
set -g window-active-style 'bg=#303446'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

set-option -g repeat-time 0

# Removes ESC delay
set -sg escape-time 0

# Image preview in Tmux (via yazi)
# https://github.com/sxyazi/yazi/wiki/Image-preview-within-tmux
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin configuration (must be set before sourcing the plugin)
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_number_position 'left'

# Load catppuccin synchronously so custom modules can use its utilities
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status line
set -g @catppuccin_date_time_text " %H:%M"
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 250
set -gF status-right "#[fg=#{@thm_green}]#[fg=#{@thm_crust},bg=#{@thm_green}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{pane_current_path}#[fg=#{@thm_surface_0}] "
set -agF status-right "#[fg=#{@thm_teal}]#[fg=#{@thm_crust},bg=#{@thm_teal}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##($DOTFILES_DIR/scripts/tmux-nowplaying.sh)#[fg=#{@thm_surface_0}] "
set -agF status-right "#[fg=#{@thm_yellow}]#[fg=#{@thm_crust},bg=#{@thm_yellow}]󰛳 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##($DOTFILES_DIR/scripts/tmux-ping.sh)#[fg=#{@thm_surface_0}] "
set -agF status-right "#[fg=#{@thm_peach}]#[fg=#{@thm_crust},bg=#{@thm_peach}]󰊚 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##($DOTFILES_DIR/scripts/tmux-loadavg.sh)#[fg=#{@thm_surface_0}] "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
